name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Check concurrent query execution
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./internal/query
      - run: go build ./...
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
