<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title description">
  <title id="title">ChronoLens local explorer architecture</title>
  <desc id="description">Explicitly selected JSONL or a checksummed snapshot validates completely before loading a catalog with row storage and shared columnar and indexed storage. A loopback Go API serves aggregate queries, exact chart profiles and bounded comparison batches to a React explorer.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#446578"/></marker>
  </defs>
  <rect width="1000" height="420" rx="18" fill="#f3f7fa"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#152c3b">
    <text x="32" y="38" font-size="22" font-weight="700">ChronoLens / local execution model</text>
    <text x="32" y="62" font-size="13" fill="#486373">One source snapshot. Three query paths. Separate, exact chart work.</text>
    <rect x="30" y="150" width="145" height="88" rx="10" fill="#fff" stroke="#9cb4c2"/>
    <text x="102" y="185" text-anchor="middle" font-size="15" font-weight="600">JSONL / snapshot</text>
    <text x="102" y="208" text-anchor="middle" font-size="12">validated once</text>
    <rect x="222" y="100" width="285" height="230" rx="12" fill="#e4f5f1" stroke="#3b9a87"/>
    <text x="242" y="132" font-size="18" font-weight="600">Immutable engine catalog</text>
    <rect x="242" y="150" width="245" height="45" rx="6" fill="#fff"/>
    <text x="258" y="178" font-size="15">Row scan / event structs</text>
    <rect x="242" y="211" width="245" height="85" rx="6" fill="#fff"/>
    <text x="258" y="238" font-size="15">Columnar scan + time index</text>
    <text x="258" y="262" font-size="12">Shared typed arrays and dictionary</text>
    <text x="258" y="281" font-size="12">No duplicate index storage</text>
    <rect x="554" y="120" width="190" height="190" rx="12" fill="#eaf0ff" stroke="#7c94ce"/>
    <text x="574" y="154" font-size="18" font-weight="600">Go HTTP API</text>
    <text x="574" y="183" font-size="13">Aggregate query</text>
    <text x="574" y="210" font-size="13">Separate chart profile</text>
    <text x="574" y="237" font-size="13">Warm engine comparison</text>
    <text x="574" y="279" font-size="12" fill="#486373">Loopback / bounded requests</text>
    <rect x="790" y="150" width="180" height="125" rx="12" fill="#fff" stroke="#9cb4c2"/>
    <text x="880" y="185" text-anchor="middle" font-size="18" font-weight="600">React explorer</text>
    <text x="880" y="212" text-anchor="middle" font-size="13">Ranges / filters / charts</text>
    <text x="880" y="237" text-anchor="middle" font-size="13">Real results and work counts</text>
    <text x="32" y="386" font-size="13" fill="#486373">All components run on one machine. No broker, database, remote API, or public deployment required.</text>
  </g>
  <g fill="none" stroke="#446578" stroke-width="2" marker-end="url(#arrow)">
    <path d="M175 194H218"/>
    <path d="M507 194H550"/>
    <path d="M744 210H786"/>
  </g>
</svg>
