<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">ChronoLens: JSONL versus snapshot loading by engine</title>
<desc id="desc">Six observed load times, paired by row, columnar, and indexed engine, on a linear zero-based seconds axis. Source file sizes are shown separately. One observed load per layout; not p95/cold-disk. No engine averaging or warm query timings. JSONL parsing and source hashing differ from snapshot decoding with block CRC32C, embedded prefix SHA-256, and whole-file source hashing. Conversion cost is not included.</desc>
<rect width="1200" height="900" rx="18" fill="#f4f7fb"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="42" font-size="12" fill="#007e72" letter-spacing="2">CHRONOLENS / STORAGE &amp; LOADING</text>
<text x="42" y="84" font-size="32" fill="#17283d" >Same events. Two storage formats.</text>
<text x="42" y="115" font-size="15" fill="#526171" >10,000,000 events | 16 services | exact reported aggregates agree across all engines</text>
<rect x="42" y="145" width="550" height="96" rx="10" fill="#ffffff" stroke="#d8e0ec"/>
<text x="62" y="173" font-size="12" fill="#315bd6" letter-spacing="1">JSONL / SOURCE FILE</text>
<text x="62" y="211" font-size="26" fill="#17283d" >826,673,337 bytes</text>
<rect x="608" y="145" width="550" height="96" rx="10" fill="#ffffff" stroke="#d8e0ec"/>
<text x="628" y="173" font-size="12" fill="#007e72" letter-spacing="1">snapshot / SOURCE FILE</text>
<text x="628" y="211" font-size="26" fill="#17283d" >160,556,844 bytes</text>
<text x="42" y="277" font-size="17" fill="#17283d" >Observed loading time (seconds, linear; zero baseline)</text>
<rect x="800" y="262" width="18" height="18" rx="3" fill="#315bd6"/>
<text x="827" y="277" font-size="14" fill="#17283d" >JSONL</text>
<rect x="953" y="262" width="18" height="18" rx="3" fill="#007e72"/>
<text x="980" y="277" font-size="14" fill="#17283d" >snapshot</text>
<line x1="210" x2="210" y1="307" y2="637" stroke="#d8e0ec"/>
<text x="210" y="660" font-size="13" fill="#526171" text-anchor="middle">0</text>
<line x1="356" x2="356" y1="307" y2="637" stroke="#d8e0ec"/>
<text x="356" y="660" font-size="13" fill="#526171" text-anchor="middle">8</text>
<line x1="502" x2="502" y1="307" y2="637" stroke="#d8e0ec"/>
<text x="502" y="660" font-size="13" fill="#526171" text-anchor="middle">16</text>
<line x1="648" x2="648" y1="307" y2="637" stroke="#d8e0ec"/>
<text x="648" y="660" font-size="13" fill="#526171" text-anchor="middle">24</text>
<line x1="794" x2="794" y1="307" y2="637" stroke="#d8e0ec"/>
<text x="794" y="660" font-size="13" fill="#526171" text-anchor="middle">32</text>
<line x1="940" x2="940" y1="307" y2="637" stroke="#d8e0ec"/>
<text x="940" y="660" font-size="13" fill="#526171" text-anchor="middle">40</text>
<text x="178" y="356" font-size="19" fill="#17283d" text-anchor="end">row</text>
<rect class="load-bar" data-engine="row" data-format="jsonl" data-load-ms="38846.2083" x="210" y="323" width="708.943301475" height="26" rx="3" fill="#315bd6"/>
<text x="928.943301475" y="342" font-size="14" fill="#315bd6" >38.846208 s</text>
<rect class="load-bar" data-engine="row" data-format="snapshot" data-load-ms="1505.2417" x="210" y="358" width="27.470661025" height="26" rx="3" fill="#007e72"/>
<text x="247.470661025" y="377" font-size="14" fill="#007e72" >1.505242 s</text>
<text x="178" y="462" font-size="19" fill="#17283d" text-anchor="end">columnar</text>
<rect class="load-bar" data-engine="columnar" data-format="jsonl" data-load-ms="36740.4385" x="210" y="429" width="670.5130026249999" height="26" rx="3" fill="#315bd6"/>
<text x="890.5130026249999" y="448" font-size="14" fill="#315bd6" >36.740438 s</text>
<rect class="load-bar" data-engine="columnar" data-format="snapshot" data-load-ms="881.422" x="210" y="464" width="16.085951499999993" height="26" rx="3" fill="#007e72"/>
<text x="236.0859515" y="483" font-size="14" fill="#007e72" >0.881422 s</text>
<text x="178" y="568" font-size="19" fill="#17283d" text-anchor="end">indexed</text>
<rect class="load-bar" data-engine="indexed" data-format="jsonl" data-load-ms="35108.614" x="210" y="535" width="640.7322055000001" height="26" rx="3" fill="#315bd6"/>
<text x="860.7322055000001" y="554" font-size="14" fill="#315bd6" >35.108614 s</text>
<rect class="load-bar" data-engine="indexed" data-format="snapshot" data-load-ms="840.9776" x="210" y="570" width="15.347841200000005" height="26" rx="3" fill="#007e72"/>
<text x="235.3478412" y="589" font-size="14" fill="#007e72" >0.840978 s</text>
<text x="42" y="705" font-size="17" fill="#17283d" >one observed load per layout; not p95/cold-disk</text>
<text x="42" y="732" font-size="14" fill="#526171" >Three engine-specific pairs, not three replicates. Warm queries and browser rendering are not plotted.</text>
<line x1="42" x2="1158" y1="755" y2="755" stroke="#d8e0ec"/>
<text x="42" y="783" font-size="14" fill="#315bd6" >JSONL load: strict record parsing + whole-file source SHA-256.</text>
<text x="42" y="809" font-size="14" fill="#007e72" >Snapshot load: decode + block CRC32C + embedded prefix SHA-256 + whole-file source SHA-256.</text>
<text x="42" y="841" font-size="14" fill="#526171" >Conversion cost not included. File bytes are storage sizes, not retained heap or transfer measurements.</text>
<text x="42" y="867" font-size="12" fill="#526171" >Aggregate agreement is not event-level parity; use compare-snapshot.mjs for an independent, full-record check.</text>
</g></svg>
